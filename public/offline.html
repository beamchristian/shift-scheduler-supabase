<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Shift Scheduler</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <!-- Shown by the service worker (public/sw.js) when the app is opened with no connection. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: #f8fafc;
        color: #0f172a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 360px;
        width: 100%;
        padding: 32px 24px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      }
      .logo {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.5;
        color: #475569;
      }
      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #4f46e5;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
      /* Matches the app's dark colors when the device is in dark mode. */
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1222;
          color: #f8fafc;
        }
        .card {
          background: #0f172a;
          border-color: #334155;
        }
        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        The scheduler needs a connection to load and save schedules. Check your Wi-Fi or data,
        then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
